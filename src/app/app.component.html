<!-- Responsive App Wrapper -->
<div class="app-container min-h-screen flex flex-col md:flex-row bg-gray-50" *ngIf="!isLoginPage()">

  <!-- Mobile Top Bar -->
  <div class="flex justify-between items-center px-4 py-3 md:hidden bg-white shadow-lg sticky top-0 z-30">
    <!-- Icon + Text Branding -->
    <div class="flex items-center gap-2">
      <i class="fas fa-layer-group text-teal-600 text-xl"></i>
      <span class="text-teal-600 font-bold text-lg tracking-wide">EniManage</span>
    </div>

    <!-- Sidebar Toggle -->
    <button 
      (click)="toggleMobileSidebar()" 
      class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 hover:bg-teal-50 text-teal-600 focus:outline-none transition-colors"
    >
      <i class="fas fa-bars"></i>
    </button>
  </div>

  <!-- Desktop Sidebar -->
  <div class="hidden md:block w-72 h-screen sticky top-0 shadow-xl">
    <div class="h-full flex flex-col bg-gradient-to-br from-teal-700 via-teal-500 to-teal-800">
      <!-- Icon + Text Branding -->
      <div class="p-5 flex items-center justify-start gap-3 border-b border-teal-500/30">
        <i class="fas fa-layer-group text-white text-2xl"></i>
        <span class="text-white font-bold text-xl tracking-wide">EniManage</span>
      </div>

      <!-- Sidebar Content -->
      <div class="flex-1 overflow-y-auto">
        <app-sidebar></app-sidebar>
      </div>

      <!-- Footer -->
      <div class="p-3 text-center text-teal-300/60 text-xs">
        <span>© 2025 EniManage. All rights reserved</span>
      </div>
    </div>
  </div>

  <!-- Mobile Sidebar Drawer -->
  <div
    class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm md:hidden transition-opacity"
    *ngIf="showMobileSidebar"
    (click)="toggleMobileSidebar()"
  >
    <div
      class="w-80 h-full shadow-2xl transform transition-transform duration-300 ease-out bg-gradient-to-br from-teal-700 via-teal-600 to-teal-800"
      [ngClass]="{'translate-x-0': showMobileSidebar, '-translate-x-full': !showMobileSidebar}"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div class="p-5 flex items-center justify-between border-b border-teal-500/30">
        <div class="flex items-center gap-3">
          <i class="fas fa-layer-group text-white text-2xl"></i>
          <span class="text-white font-bold text-xl tracking-wide">EniManage</span>
        </div>
        <button 
          (click)="toggleMobileSidebar()" 
          class="w-8 h-8 flex items-center justify-center rounded-full bg-teal-600/30 hover:bg-teal-500/50 text-white transition-colors"
        >
          <i class="fas fa-times"></i>
        </button>
      </div>

      <!-- Sidebar Content -->
      <div class="flex-1 overflow-y-auto">
        <app-sidebar></app-sidebar>
      </div>

      <!-- Footer -->
      <div class="p-3 text-center text-teal-300/60 text-xs">
        <span>© 2025 EniManage. All rights reserved</span>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col">
    <!-- Desktop Header -->
    <div class="hidden md:flex justify-between items-center bg-white px-6 py-4 sticky top-0 z-10 shadow-sm border-b border-gray-100">
      <h1 class="text-xl font-semibold text-gray-800">{{ currentPage }}</h1>

      <div class="flex items-center gap-3">
        <!-- User Profile -->
        <div class="flex items-center gap-3 pl-3 border-l border-gray-200">
          <div class="w-9 h-9 rounded-full bg-teal-600 flex items-center justify-center text-white font-medium">
            {{ userInitials }}
          </div>
          <div class="hidden lg:block">
            <p class="text-sm font-medium text-gray-700">{{ userName }}</p>
            <p class="text-xs text-gray-500">{{ userRole }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Router Outlet Area -->
    <div class="flex-1 p-4 md:p-6 overflow-y-auto">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<!-- Login Page (no layout) -->
<router-outlet *ngIf="isLoginPage()"></router-outlet>
