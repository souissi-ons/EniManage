<div class="p-8 rounded-2xl shadow-xl bg-white border border-gray-200">
  <form [formGroup]="addSalleForm" (ngSubmit)="onSubmit()">
    <div class="mt-8 grid lg:grid-cols-2 gap-6">
      <div>
        <label for="name" class="text-sm text-gray-600 block mb-2 font-semibold">Name</label>
        <input
          type="text"
          name="name"
          id="name"
          formControlName="name"
          class="bg-white border border-gray-300 rounded-xl py-2 px-4 block w-full text-gray-800 focus:outline-none focus:ring-0 focus:border-teal-400"
          placeholder="Enter salle name"
        />
        <div
          *ngIf="addSalleForm.get('name')?.invalid && (addSalleForm.get('name')?.dirty || addSalleForm.get('name')?.touched)"
          class="mt-1 text-sm text-red-500"
        >
          <div *ngIf="addSalleForm.get('name')?.hasError('required')">
            Name is required.
          </div>
        </div>
      </div>

      <div>
        <label for="capacity" class="text-sm text-gray-600 block mb-2 font-semibold">Capacity</label>
        <input
          type="number"
          name="capacity"
          id="capacity"
          formControlName="capacity"
          class="bg-white border border-gray-300 rounded-xl py-2 px-4 block w-full text-gray-800 focus:outline-none focus:ring-0 focus:border-teal-400"
          placeholder="0"
        />
        <div
          *ngIf="addSalleForm.get('capacity')?.invalid && (addSalleForm.get('capacity')?.dirty || addSalleForm.get('capacity')?.touched)"
          class="mt-1 text-sm text-red-500"
        >
          <div *ngIf="addSalleForm.get('capacity')?.hasError('required')">
            Capacity is required.
          </div>
        </div>
      </div>
    </div>

    <div class="mt-6">
      <label for="description" class="text-sm text-gray-600 block mb-2 font-semibold">Description</label>
      <textarea
        name="description"
        id="description"
        formControlName="description"
        class="bg-white border border-gray-300 rounded-xl py-2 px-4 block w-full text-gray-800 focus:outline-none focus:ring-0 focus:border-teal-400"
        placeholder="Enter salle description"
      ></textarea>
      <div
        *ngIf="addSalleForm.get('description')?.invalid && (addSalleForm.get('description')?.dirty || addSalleForm.get('description')?.touched)"
        class="mt-1 text-sm text-red-500"
      >
        <div *ngIf="addSalleForm.get('description')?.hasError('required')">
          Description is required.
        </div>
      </div>
    </div>

    <div class="mt-6">
      <label class="text-sm text-gray-600 block mb-2 font-semibold">Batiment</label>
      <div class="flex flex-wrap gap-6">
        <label class="inline-flex items-center">
          <input
            type="radio"
            name="batiment"
            value="Principal"
            class="h-5 w-5 text-teal-600 focus:ring-teal-500 border-gray-300 focus:outline-none focus:ring-0"
            formControlName="batiment"
            checked
          />
          <span class="ml-2 text-gray-700">Principal</span>
        </label>
        <label class="inline-flex items-center">
          <input
            type="radio"
            name="batiment"
            value="Annexe"
            formControlName="batiment"
            class="h-5 w-5 text-teal-600 focus:ring-teal-500 border-gray-300 focus:outline-none focus:ring-0"
          />
          <span class="ml-2 text-gray-700">Annexe</span>
        </label>
      </div>
      <div
        *ngIf="addSalleForm.get('batiment')?.invalid && (addSalleForm.get('batiment')?.dirty || addSalleForm.get('batiment')?.touched)"
        class="mt-1 text-sm text-red-500"
      >
        <div *ngIf="addSalleForm.get('batiment')?.hasError('required')">
          Batiment is required.
        </div>
      </div>
    </div>

    <div class="mt-8">
      <label class="text-sm text-gray-600 block mb-2 font-semibold">Ressources</label>
      <div formArrayName="ressources" class="space-y-4">
        <div *ngIf="resourcesArray.length === 0" class="flex justify-start">
          <button type="button" (click)="addResource()" class="text-teal-600 font-medium hover:underline">
            <i class="fa fa-plus mr-1"></i> Ajouter une ressource
          </button>
        </div>
        <div
          *ngFor="let resource of resourcesArray.controls; let i = index"
          [formGroupName]="i"
          class="flex items-center gap-4"
        >
          <select
            formControlName="resourceName"
            class="bg-white border border-gray-300 rounded-xl py-2 px-4 w-full focus:outline-none focus:ring-0 focus:border-teal-400"
          >
            <option value="" disabled selected>Select a resource</option>
            <option *ngFor="let res of resources" [value]="res.id">
              {{ res.name }}
            </option>
          </select>

          <input
            type="number"
            formControlName="quantity"
            class="bg-white border border-gray-300 rounded-xl py-2 px-4 block w-full text-gray-800 focus:outline-none focus:ring-0 focus:border-teal-400"
            placeholder="0"
          />

          <div class="flex gap-2">
            <button type="button" (click)="removeResource(i)" class="text-red-600 hover:text-red-800">
              <i class="fa fa-minus"></i>
            </button>
            <button type="button" (click)="addResource()" class="text-teal-600 hover:text-teal-800">
              <i class="fa fa-plus"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-10">
      <button
        type="submit"
        class="py-2 px-6 bg-teal-500 text-white rounded-xl shadow hover:bg-teal-600 transition disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="addSalleForm.invalid"
      >
        Save
      </button>
    </div>
  </form>
</div>
