<div class="bg-white py-6 px-4 sm:px-6 lg:px-8">
  <!-- Header actions -->
  <div class="flex flex-col sm:flex-row justify-end items-center mb-6 gap-4">
    <button
      (click)="openAddUserPopup()"
      class="flex items-center gap-2 px-5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium rounded-lg transition-all shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500"
    >
      <i class="fa-solid fa-user-plus text-base"></i>
      Add User
    </button>
  </div>

  <!-- Table container -->
  <div class="overflow-x-auto shadow ring-1 ring-gray-200 sm:rounded-lg">
    <table class="min-w-full divide-y divide-gray-200 text-sm text-gray-700">
      <thead class="bg-gray-50 text-xs uppercase font-semibold text-gray-600">
        <tr>
          <th class="px-4 py-3 text-left">Name</th>
          <th class="px-4 py-3 text-left">Email</th>
          <th class="px-4 py-3 text-left">Phone</th>
          <th class="px-4 py-3 text-left">Birth Date</th>
          <th class="px-4 py-3 text-left">Role</th>
          <th class="px-4 py-3 text-center">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 bg-white">
        <tr *ngFor="let user of users" class="hover:bg-gray-50">
          <td class="px-4 py-3">{{ user.name }}</td>
          <td class="px-4 py-3">{{ user.email }}</td>
          <td class="px-4 py-3">{{ user.phoneNumber }}</td>
          <td class="px-4 py-3">{{ user.birthDate | date : "dd/MM/yyyy" }}</td>
          <td class="px-4 py-3">{{ user.role }}</td>
          <td class="px-4 py-3 text-center">
            <div class="flex items-center justify-center gap-2">
              <button
                (click)="openEditUserPopup(user)"
                class="p-2 rounded-full hover:bg-teal-100 text-teal-700 transition"
                aria-label="Edit User"
              >
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button
            class="p-2 rounded-full hover:bg-red-100 text-red-600 transition"
              (click)="openDeleteUserPopup(user)"
            >
            <i class="fa-solid fa-trash"></i>

            </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Popups -->
  <app-popup
    [title]="'Add User'"
    [show]="showAddUserPopup"
    (close)="closeAddUserPopup()"
  >
    <app-add-user></app-add-user>
  </app-popup>

  <app-popup
    [title]="'Edit User'"
    [show]="showEditUserPopup"
    (close)="closeEditUserPopup()"
  >
    <app-update-user [userData]="selectedUser"></app-update-user>
  </app-popup>

  <app-popup
    [title]="'Delete User'"
    [show]="showDeleteUserPopup"
    (close)="closeDeleteUserPopup()"
  >
    <app-confirmation-dialog
      [selectedName]="selectedName"
      (confirmed)="handleDeleteConfirmation($event)"
    ></app-confirmation-dialog>
  </app-popup>
</div>
