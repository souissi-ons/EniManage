<div class="p-8 bg-white rounded-2xl shadow-lg border border-gray-100">
  <form [formGroup]="addUserForm" (ngSubmit)="onSubmit()">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Name -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          placeholder="Enter your name"
          class="mt-2 w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
        <div
          *ngIf="addUserForm.get('name')?.invalid && (addUserForm.get('name')?.dirty || addUserForm.get('name')?.touched)"
          class="mt-1 text-sm text-red-600"
        >
          <div *ngIf="addUserForm.get('name')?.hasError('required')">Name is required.</div>
        </div>
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input
          type="text"
          id="email"
          formControlName="email"
          placeholder="yourmail@provider.com"
          class="mt-2 w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
        <div
          *ngIf="addUserForm.get('email')?.invalid && (addUserForm.get('email')?.dirty || addUserForm.get('email')?.touched)"
          class="mt-1 text-sm text-red-600"
        >
          <div *ngIf="addUserForm.get('email')?.hasError('required')">Email is required.</div>
          <div *ngIf="addUserForm.get('email')?.hasError('email')">Invalid email format.</div>
        </div>
      </div>

      <!-- Phone Number -->
      <div>
        <label for="phoneNumber" class="block text-sm font-medium text-gray-700">Phone number</label>
        <input
          type="tel"
          id="phoneNumber"
          formControlName="phoneNumber"
          placeholder="0123456789"
          class="mt-2 w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
        <div
          *ngIf="addUserForm.get('phoneNumber')?.invalid && (addUserForm.get('phoneNumber')?.dirty || addUserForm.get('phoneNumber')?.touched)"
          class="mt-1 text-sm text-red-600"
        >
          <div *ngIf="addUserForm.get('phoneNumber')?.hasError('required')">Phone number is required.</div>
          <div *ngIf="addUserForm.get('phoneNumber')?.hasError('pattern')">Invalid phone number format.</div>
        </div>
      </div>

      <!-- Birth Date -->
      <div>
        <label for="birthDate" class="block text-sm font-medium text-gray-700">Birth date</label>
        <input
          type="date"
          id="birthDate"
          formControlName="birthDate"
          class="mt-2 w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
        <div
          *ngIf="addUserForm.get('birthDate')?.invalid && (addUserForm.get('birthDate')?.dirty || addUserForm.get('birthDate')?.touched)"
          class="mt-1 text-sm text-red-600"
        >
          <div *ngIf="addUserForm.get('birthDate')?.hasError('required')">Birth date is required.</div>
        </div>
      </div>

      <!-- Role Selection -->
      <div class="lg:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-2">Role</label>
        <div class="flex flex-wrap gap-4">
          <label class="inline-flex items-center gap-2">
            <input type="radio" name="role" value="STUDENT" formControlName="role" checked class="text-teal-600" />
            <span class="text-gray-700">Student</span>
          </label>
          <label class="inline-flex items-center gap-2">
            <input type="radio" name="role" value="CLUB" formControlName="role" class="text-teal-600" />
            <span class="text-gray-700">Club</span>
          </label>
          <label class="inline-flex items-center gap-2">
            <input type="radio" name="role" value="TEACHER" formControlName="role" class="text-teal-600" />
            <span class="text-gray-700">Teacher</span>
          </label>
          <label class="inline-flex items-center gap-2">
            <input type="radio" name="role" value="ADMIN" formControlName="role" class="text-teal-600" />
            <span class="text-gray-700">Admin</span>
          </label>
        </div>
        <div
          *ngIf="addUserForm.get('role')?.invalid && (addUserForm.get('role')?.dirty || addUserForm.get('role')?.touched)"
          class="mt-1 text-sm text-red-600"
        >
          <div *ngIf="addUserForm.get('role')?.hasError('required')">Role is required.</div>
        </div>
      </div>

      <!-- Club Description -->
      <div *ngIf="addUserForm.get('role')?.value === 'CLUB'" class="lg:col-span-2">
        <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
        <textarea
          id="description"
          formControlName="description"
          rows="4"
          placeholder="Enter club description"
          class="mt-2 w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-teal-500"
        ></textarea>
      </div>

      <!-- Club Logo -->
      <div *ngIf="addUserForm.get('role')?.value === 'CLUB'" class="lg:col-span-2">
        <label class="block text-sm font-medium text-gray-700">Logo</label>
        <input
          type="file"
          id="logo"
          (change)="onFileSelected($event)"
          accept="image/*"
          class="mt-2 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100"
        />
        <div *ngIf="logoPreview" class="mt-4">
          <img [src]="logoPreview" alt="Logo preview" class="h-20 w-20 object-cover rounded-full" />
        </div>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="mt-10 flex justify-end">
      <button
        type="submit"
        [disabled]="addUserForm.invalid"
        class="px-6 py-2 rounded-xl text-white font-semibold transition-colors duration-200"
        [class.bg-teal-600]="!addUserForm.invalid"
        [class.hover:bg-teal-700]="!addUserForm.invalid"
        [class.bg-gray-300]="addUserForm.invalid"
        [class.cursor-not-allowed]="addUserForm.invalid"
      >
        Save
      </button>
    </div>
  </form>
</div>
