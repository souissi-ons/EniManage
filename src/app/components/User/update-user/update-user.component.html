<div class="p-8 rounded border border-gray-200">
  <form [formGroup]="editUserForm" (ngSubmit)="onSubmit()">
    <div class="mt-8 grid lg:grid-cols-2 gap-4">
      <div>
        <label for="name" class="text-md text-gray-700 block mb-1 font-bold"
          >Name</label
        >
        <div class="mt-1">
          <input
            type="text"
            name="name"
            id="name"
            formControlName="name"
            class="bg-gray-100 border border-gray-200 rounded py-1 px-3 block focus:ring-teal-light focus:border-teal-light text-gray-700 w-full"
            placeholder="Enter your name"
          />

          <div
            *ngIf="
              editUserForm.get('name')?.invalid &&
              (editUserForm.get('name')?.dirty ||
                editUserForm.get('name')?.touched)
            "
            class="mt-1 text-sm text-red-600"
          >
            <div *ngIf="editUserForm.get('name')?.hasError('required')">
              Name is required.
            </div>
          </div>
        </div>
      </div>
      <div>
        <label for="email" class="text-md text-gray-700 block mb-1 font-bold"
          >Email</label
        >
        <div class="mt-1">
          <input
            type="text"
            name="email"
            id="email"
            formControlName="email"
            class="bg-gray-100 border border-gray-200 rounded py-1 px-3 block focus:ring-teal-light focus:border-teal-light text-gray-700 w-full"
            placeholder="yourmail@provider.com"
          />
          <div
            *ngIf="
              editUserForm.get('email')?.invalid &&
              (editUserForm.get('email')?.dirty ||
                editUserForm.get('email')?.touched)
            "
            class="mt-1 text-sm text-red-600"
          >
            <div *ngIf="editUserForm.get('email')?.hasError('required')">
              Email is required.
            </div>
            <div *ngIf="editUserForm.get('email')?.hasError('email')">
              Invalid email format.
            </div>
          </div>
        </div>
      </div>

      <div>
        <label
          for="phoneNumber"
          class="text-md text-gray-700 block mb-1 font-bold"
          >Phone number</label
        >
        <div class="mt-1">
          <input
            type="tel"
            name="phoneNumber"
            id="phoneNumber"
            formControlName="phoneNumber"
            class="bg-gray-100 border border-gray-200 rounded py-1 px-3 block focus:ring-teal-light focus:border-teal-light text-gray-700 w-full"
            placeholder="0123456789"
          />
          <div
            *ngIf="
              editUserForm.get('phoneNumber')?.invalid &&
              (editUserForm.get('phoneNumber')?.dirty ||
                editUserForm.get('phoneNumber')?.touched)
            "
            class="mt-1 text-sm text-red-600"
          >
            <div *ngIf="editUserForm.get('phoneNumber')?.hasError('required')">
              Phone number is required.
            </div>
            <div *ngIf="editUserForm.get('phoneNumber')?.hasError('pattern')">
              Invalid phone number format.
            </div>
          </div>
        </div>
      </div>
      <div>
        <label
          for="birthDate"
          class="text-md text-gray-700 block mb-1 font-bold"
          >Birth date</label
        >
        <div class="mt-1">
          <input
            type="date"
            name="birthDate"
            id="birthDate"
            formControlName="birthDate"
            class="bg-gray-100 border border-gray-200 rounded py-1 px-3 block focus:ring-teal-dark focus:border-teal-light text-gray-700 w-full"
            placeholder="(01/01/1993)"
          />
          <div
            *ngIf="
              editUserForm.get('birthDate')?.invalid &&
              (editUserForm.get('birthDate')?.dirty ||
                editUserForm.get('birthDate')?.touched)
            "
            class="mt-1 text-sm text-red-600"
          >
            <div *ngIf="editUserForm.get('birthDate')?.hasError('required')">
              Birth date is required.
            </div>
          </div>
        </div>
      </div>

      <div class="lg:col-span-2">
        <label class="text-md text-gray-700 block mb-3 font-bold">Role</label>
        <div class="flex flex-wrap gap-3 lg:gap-16">
          <label class="inline-flex items-center">
            <input
              type="radio"
              name="role"
              value="STUDENT"
              class="h-5 w-5 text-teal-600 focus:ring-teal-500 border-gray-300"
              formControlName="role"
              checked
            />
            <span class="ml-2 text-gray-700">Student</span>
          </label>
          <label class="inline-flex items-center">
            <input
              type="radio"
              name="role"
              value="CLUB"
              formControlName="role"
              class="h-5 w-5 text-teal-600 focus:ring-teal-500 border-gray-300"
            />
            <span class="ml-2 text-gray-700">Club</span>
          </label>
          <label class="inline-flex items-center">
            <input
              type="radio"
              name="role"
              value="TEACHER"
              formControlName="role"
              class="h-5 w-5 text-teal-600 focus:ring-teal-500 border-gray-300"
            />
            <span class="ml-2 text-gray-700">Teacher</span>
          </label>

          <label class="inline-flex items-center">
            <input
              type="radio"
              name="role"
              value="ADMIN"
              formControlName="role"
              class="h-5 w-5 text-teal-600 focus:ring-teal-500 border-gray-300"
            />
            <span class="ml-2 text-gray-700">Admin</span>
          </label>
        </div>
        <div
          *ngIf="
            editUserForm.get('role')?.invalid &&
            (editUserForm.get('role')?.dirty ||
              editUserForm.get('role')?.touched)
          "
          class="mt-1 text-sm text-red-600"
        >
          <div>
            <div *ngIf="editUserForm.get('role')?.hasError('required')">
              Role is required.
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      *ngIf="editUserForm.get('role')?.value === 'CLUB'"
      class="lg:col-span-2"
    >
      <label
        for="description"
        class="text-md text-gray-700 block mb-1 font-bold"
        >Description</label
      >
      <div class="mt-1">
        <textarea
          name="description"
          id="description"
          formControlName="description"
          rows="4"
          class="bg-gray-100 border border-gray-200 rounded py-1 px-3 block focus:ring-teal-light focus:border-teal-light text-gray-700 w-full"
          placeholder="Enter club description"
        ></textarea>
      </div>
    </div>

    <div
      *ngIf="editUserForm.get('role')?.value === 'CLUB'"
      class="lg:col-span-2"
    >
      <label class="text-md text-gray-700 block mb-1 font-bold">Logo</label>
      <div class="mt-1 flex items-center gap-4">
        <div *ngIf="existingLogoUrl" class="flex-shrink-0">
          <img
            [src]="newImageSelected ? logoPreview : existingLogoUrl"
            alt="Club logo"
            class="h-20 w-20 object-cover rounded"
          />
        </div>

        <div class="flex-grow">
          <input
            type="file"
            name="logo"
            id="logo"
            (change)="onFileSelected($event)"
            accept="image/*"
            class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100"
          />
          <div *ngIf="logoPreview" class="mt-2">
            <img
              [src]="logoPreview"
              alt="New logo preview"
              class="h-20 w-20 object-cover rounded"
            />
            <p class="text-sm text-gray-500 mt-1">Nouveau logo sélectionné</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Message de succès -->
    <div
      *ngIf="successMessage"
      class="mb-4 p-4 rounded-md bg-green-50 border border-green-200"
    >
      <div class="flex">
        <div class="flex-shrink-0">
          <svg
            class="h-5 w-5 text-green-400"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm font-medium text-green-800">
            {{ successMessage }}
          </p>
        </div>
      </div>
    </div>

    <!-- Message d'erreur -->
    <div
      *ngIf="errorMessage"
      class="mb-4 p-4 rounded-md bg-red-50 border border-red-200"
    >
      <div class="flex">
        <div class="flex-shrink-0">
          <svg
            class="h-5 w-5 text-red-400"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm font-medium text-green-800">
            {{ errorMessage }}
          </p>
        </div>
      </div>
    </div>

    <div class="space-x-4 mt-8">
      <button
        type="submit"
        class="py-2 px-4 bg-teal-light text-white rounded hover:bg-teal-dark active:bg-teal-light disabled:opacity-50"
        [class.bg-teal]="
          !editUserForm.invalid && (editUserForm.dirty || newImageSelected)
        "
        [class.hover:bg-teal-dark]="
          (!editUserForm.invalid && editUserForm.dirty) || newImageSelected
        "
        [class.focus:ring-teal-light]="
          (!editUserForm.invalid && editUserForm.dirty) || newImageSelected
        "
        [class.bg-teal-dark]="
          (editUserForm.invalid || !editUserForm.dirty) && !newImageSelected
        "
        [class.cursor-not-allowed]="
          (editUserForm.invalid || !editUserForm.dirty) && !newImageSelected
        "
        [disabled]="
          (editUserForm.invalid || !editUserForm.dirty) && !newImageSelected
        "
      >
        Update
      </button>
    </div>
  </form>
</div>
