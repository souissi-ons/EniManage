<div class="w-full max-w-sm h-96 rounded-2xl shadow-lg overflow-hidden bg-white hover:shadow-xl transition duration-300 flex flex-col">
    <img
      class="h-40 w-full object-cover"
      [src]="getImageUrl()"
      alt="Event Image"
    />
    <div class="p-5 flex flex-col h-56">
      <div class="text-xs font-semibold text-gray-500">Event #{{ event.id }}</div>
      <div class="text-lg font-bold text-gray-800 truncate mb-2">{{ event.title }}</div>
      
      <!-- Description with truncation using Tailwind -->
      <p class="text-sm text-gray-600 overflow-hidden line-clamp-3 mb-2">
        {{ event.description }}
      </p>
      
      <!-- Spacer to push button to bottom -->
      <div class="flex-grow"></div>
      
      <div class="flex items-center justify-between">
        <span [ngClass]="eventStatusClass" class="px-3 py-1 text-xs font-semibold rounded-full">
          {{ event.status }}
        </span>
        <button
          (click)="handleViewDetails()"
          class="ml-2 bg-teal-400 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-teal-500 transition-colors"
        >
          Details
        </button>
      </div>
    </div>
  </div>
