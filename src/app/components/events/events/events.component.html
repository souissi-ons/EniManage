<!-- event-grid.component.html -->
<div class="container mx-auto px-4 py-10">
    <!-- Search and filter bar -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div class="relative w-full md:w-72">
        <input
          type="text"
          placeholder="Search events..."
          class="w-full pl-10 pr-4 py-2 rounded-xl border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-[#4FD1C5] transition"
          formControlName="searchTerm"
          (input)="filterEvents()" />
        <svg class="absolute left-3 top-2.5 h-5 w-5 text-gray-400 pointer-events-none" fill="none" stroke="currentColor"
          viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
  
      <div class="w-full md:w-auto">
        <select
          class="w-full md:w-auto bg-white border border-gray-300 rounded-xl px-4 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-[#4FD1C5] transition"
          formControlName="sortBy"
          (change)="sortEvents()">
          <option value="date_asc">Date (Earliest)</option>
          <option value="date_desc">Date (Latest)</option>
          <option value="popularity">Most Popular</option>
        </select>
      </div>
    </div>
  
    <!-- Loading state -->
    <div *ngIf="loading" class="flex justify-center items-center py-20">
      <div class="h-12 w-12 rounded-full border-4 border-t-[#4FD1C5] border-gray-200 animate-spin"></div>
    </div>
  
    <!-- Error state -->
    <div *ngIf="error"
      class="bg-red-50 border border-red-300 text-red-700 px-4 py-3 rounded-xl shadow-sm mb-6">
      {{ error }}
    </div>
  
    <!-- Empty state -->
    <div *ngIf="!loading && !error && filteredEvents.length === 0"
      class="text-center py-20 text-gray-500">
      <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor"
        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <h3 class="text-lg font-semibold">No events found</h3>
      <p class="mt-1 text-sm">Try adjusting your search or filter criteria</p>
    </div>
  
    <!-- Event grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <app-event-card
        *ngFor="let event of filteredEvents"
        [event]="event"
        (updateNeeded)="refreshEvents()"
        (viewDetails)="onViewDetails($event)"
        class="h-full">
      </app-event-card>
    </div>
  
    <!-- Pagination -->
    <div *ngIf="totalPages > 1" class="flex justify-center mt-10">
      <nav class="inline-flex overflow-hidden rounded-xl shadow-sm border border-gray-300">
        <button
          class="px-4 py-2 text-sm bg-white text-gray-700 hover:bg-gray-50 transition disabled:opacity-50"
          [disabled]="currentPage === 1"
          (click)="changePage(currentPage - 1)">
          Previous
        </button>
  
        <ng-container *ngFor="let page of getPaginationArray()">
          <button
            class="px-4 py-2 text-sm border-l border-gray-300 transition"
            [ngClass]="{
              'bg-[#4FD1C5] text-white': page === currentPage,
              'bg-white text-gray-700 hover:bg-gray-50': page !== currentPage
            }"
            (click)="changePage(page)">
            {{ page }}
          </button>
        </ng-container>
  
        <button
          class="px-4 py-2 text-sm bg-white text-gray-700 hover:bg-gray-50 transition border-l border-gray-300 disabled:opacity-50"
          [disabled]="currentPage === totalPages"
          (click)="changePage(currentPage + 1)">
          Next
        </button>
      </nav>
    </div>
  </div>
