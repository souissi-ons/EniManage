<div class="bg-white py-4 md:py-7 px-4 md:px-8 xl:px-10">
  <div class="flex justify-end">
    <button
      (click)="handleRequestEvent()"
      class="focus:ring-2 focus:ring-offset-2 focus:ring-teal-dark mt-4 sm:mt-0 inline-flex items-start justify-start px-6 py-3 bg-teal-light hover:bg-teal-dark focus:outline-none rounded"
    >
      <p class="text-sm font-medium leading-none text-white">Request Event</p>
    </button>
  </div>

  <!-- Loading indicator -->
  <div *ngIf="loading" class="flex justify-center items-center py-12">
    <div class="spinner-border text-teal-light" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>

  <!-- Error message -->
  <div *ngIf="error" class="text-center py-8 text-red-600">
    {{ error }}
  </div>

  <!-- No events message -->
  <div *ngIf="!loading && !error && events.length === 0" class="text-center py-8 text-gray-600">
    No events available. Use the "Request Event" button to create one.
  </div>

  <!-- Events grid -->
  <div
    *ngIf="!loading && !error && events.length > 0"
    class="p-6 px-0 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 justify-items-center mt-auto"
  >
    <app-club-event-card
      *ngFor="let event of events"
      [event]="event"
      (viewDetails)="handleViewDetails($event)">
    </app-club-event-card>
  </div>
</div>

<app-popup
  [title]="'Request Event'"
  [show]="showRequestEventPopup"
  (close)="closeRequestEventPopup()"
>
  <app-request-event
    (eventRequested)="handleEventRequested()"
    (closeModal)="closeRequestEventPopup()"
  ></app-request-event>
</app-popup>
