<!-- event-card.component.html -->
<div class="w-auto rounded-lg bg-white overflow-hidden flex flex-col h-96">
  <img
    class="rounded-t-lg w-auto h-32 object-cover mx-auto"
    [src]="getImageUrl()"
    alt="Event Image"
  />
  <div class="p-4 flex flex-col flex-grow">
    <div class="text-sm text-gray-600">Event #{{ event.id }}</div>
    <div class="p-4 text-lg font-semibold text-gray-800">{{ event.title }}</div>
    <div class="text-sm text-gray-600 mb-4 space-y-2">
      {{ event.description }}
    </div>

    <!-- Attend button -->
    <button
      *ngIf="getButtonState() === 'attend'"
      class="w-20 text-center mt-auto p-4 bg-white text-[#4FD1C5] border border-[#4FD1C5] py-2 rounded-xl font-medium hover:bg-[#4FD1C5] hover:text-white transition-colors"
      (click)="showConfirmModal = true">
      Attend
    </button>

    <!-- Attending button -->
    <button
      *ngIf="getButtonState() === 'attending'"
      class="w-20 text-center mt-auto p-4 bg-[#4FD1C5] text-white border border-[#4FD1C5] py-2 rounded-xl font-medium"
      disabled>
      Attending
    </button>

    <!-- Feedback button -->
    <button
      *ngIf="getButtonState() === 'feedback'"
      class="w-20 text-center mt-auto p-4 bg-gray-300 text-white border border-gray-300 py-2 rounded-xl font-medium"
      disabled>
      Feedback
    </button>
  </div>

  <!-- Confirmation Modal -->
  <app-popup 
    *ngIf="showConfirmModal"
    title="Confirm Attendance"
    [show]="showConfirmModal"
    (close)="showConfirmModal = false">
    
    <p>Are you sure you want to attend this event?</p>

    <div class="flex justify-end space-x-4 mt-4">
      <button 
        class="px-4 py-2 text-gray-600 hover:text-gray-800"
        (click)="showConfirmModal = false">
        Cancel
      </button>
      <button 
        class="px-4 py-2 bg-[#4FD1C5] text-white rounded hover:bg-[#3da89d]"
        (click)="handleAttendClick()">
        Confirm
      </button>
    </div>

  </app-popup>
</div>
