<!-- event-card.component.html -->
<div class="h-full rounded-lg bg-white shadow-md overflow-hidden flex flex-col hover:shadow-lg transition-shadow duration-300">
  <!-- Event Image -->
  <div class="relative">
    <img
      class="w-full h-48 object-cover"
      [src]="getImageUrl()"
      alt="Event Image"
    />
    
    <!-- Event Status Badge -->
    <div class="absolute top-3 right-3">
      <span *ngIf="event.isParticipating" class="px-2 py-1 bg-[#4FD1C5] text-white text-xs rounded-full">
        Attending
      </span>
    </div>
  </div>
  
  <!-- Event Content -->
  <div class="p-4 flex flex-col flex-grow">
    <!-- Event Metadata -->
    <div class="flex items-center justify-between mb-2">
      <div class="text-xs text-gray-500">Event #{{ event.id }}</div>
      <div class="flex items-center text-xs text-gray-500">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        {{ event.currentParticipants || 0 }}
      </div>
    </div>
    
    <!-- Event Title -->
    <h3 class="text-lg font-semibold text-gray-800 mb-2">
      {{ event.title }}
    </h3>
    
    <!-- Event Date -->
    <div *ngIf="event.date_start " class="flex items-center text-sm text-gray-600 mb-3">
      <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
      </svg>
      {{ formatDate(event.date_start ) }}
    </div>
    
    <!-- Event Description -->
    <div class="text-sm text-gray-600 mb-4 line-clamp-3">
      {{ event.description }}
      {{event.date_start}}
    </div>
    
    <!-- Action Buttons -->
    <div class="mt-auto flex items-center justify-between">
      <!-- Attend button -->
      <button
        *ngIf="getButtonState() === 'attend'"
        class="px-4 py-2 bg-white text-[#4FD1C5] border border-[#4FD1C5] rounded-lg font-medium hover:bg-[#4FD1C5] hover:text-white transition-colors"
        (click)="handleButtonClick()">
        Attend
      </button>
      
      <!-- Feedback button -->
      <button
        *ngIf="getButtonState() === 'feedback'"
        class="px-4 py-2 bg-gray-300 text-white border border-gray-300 rounded-lg font-medium hover:bg-gray-400"
        (click)="handleButtonClick()">
        Feedback
      </button>
      
      <!-- Details button -->
      <button 
        class="px-4 py-2 text-gray-600 hover:text-gray-800 transition-colors"
        (click)="handleViewDetails()">
        Details
      </button>
    </div>
  </div>
  
  <!-- Confirmation Modal -->
  <app-popup
    *ngIf="showConfirmModal"
    title="Confirm Attendance"
    [show]="showConfirmModal"
    (close)="showConfirmModal = false">
   
    <p>Are you sure you want to attend this event?</p>
    <div class="flex justify-end space-x-4 mt-4">
      <button
        class="px-4 py-2 text-gray-600 hover:text-gray-800"
        (click)="showConfirmModal = false">
        Cancel
      </button>
      <button
        class="px-4 py-2 bg-[#4FD1C5] text-white rounded hover:bg-[#3da89d]"
        (click)="handleAttendClick()">
        Confirm
      </button>
    </div>
  </app-popup>
  
  <!-- Feedback Modal -->
  <app-popup
    *ngIf="showFeedbackModal"
    title="Give Feedback"
    [show]="showFeedbackModal"
    (close)="closeFeedbackModal()">
    
    <p class="mb-4">Please share your feedback about this event:</p>
    <textarea 
      class="w-full h-32 p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#4FD1C5]"
      [(ngModel)]="feedbackComment"
      placeholder="Your feedback..."></textarea>
    
    <div class="flex justify-end space-x-4 mt-4">
      <button
        class="px-4 py-2 text-gray-600 hover:text-gray-800"
        (click)="closeFeedbackModal()">
        Cancel
      </button>
      <button
        class="px-4 py-2 bg-[#4FD1C5] text-white rounded hover:bg-[#3da89d]"
        (click)="submitFeedback()">
        Submit
      </button>
    </div>
  </app-popup>
</div>
