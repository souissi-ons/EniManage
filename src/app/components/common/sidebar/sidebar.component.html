<nav class="flex flex-col h-full py-2">
  <!-- Navigation Links -->
  <div class="flex-1 flex flex-col gap-1 px-2">
    <ng-container *ngFor="let item of menuItems">
      <a
        [routerLink]="item.route"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-teal-100 hover:bg-white/10 transition-all duration-200 group"
        routerLinkActive="bg-white/10 before:absolute before:left-0 before:w-1 before:h-8 before:bg-teal-300 before:rounded-r relative"
      >
        <div class="w-9 h-9 flex items-center justify-center rounded-lg bg-teal-600/30 text-teal-100 group-hover:bg-teal-500/40 transition-all">
          <i [class]="item.icon + ' text-base'"></i>
        </div>
        <span class="text-sm font-medium">{{ item.label }}</span>
      </a>
    </ng-container>
  </div>
  
  <!-- Logout Button -->
  <div class="px-2 mt-4">
    <button
      class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-teal-100 hover:bg-red-500/50 transition-all duration-200 group"
      (click)="logout()"
    >
      <div class="w-9 h-9 flex items-center justify-center rounded-lg bg-red-500/30 text-teal-100 group-hover:bg-red-600/80 transition-all">
        <i class="fas fa-sign-out-alt text-base"></i>
      </div>
      <span class="text-sm font-medium">Logout</span>
    </button>
  </div>
</nav>
