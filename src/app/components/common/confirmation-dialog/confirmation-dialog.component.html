<div class="p-4">
  <h3 class="text-lg font-medium text-gray-900 mb-4">Confirm Delete</h3>
  <p class="text-sm text-gray-500 mb-6">
    Are you sure you want to delete
    <span class="font-semibold">{{ selectedName }} ?</span>
  </p>
  <div class="flex justify-end space-x-3">
    <button
      type="button"
      class="px-4 py-2 bg-white border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500"
      (click)="onCancel()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="px-4 py-2 bg-red-600 border border-transparent rounded-md text-sm font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"
      (click)="onConfirm()"
    >
      Delete
    </button>
  </div>
</div>
