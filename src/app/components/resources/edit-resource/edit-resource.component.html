<div class="p-8 rounded border border-gray-200">
  <form [formGroup]="editResourceForm" (ngSubmit)="onSubmit()">
    <div class="mt-8 grid lg:grid-cols-2 gap-4">
      <div>
        <label for="name" class="text-md text-gray-700 block mb-1 font-bold"
          >Name</label
        >
        <div class="mt-1">
          <input
            type="text"
            name="name"
            id="name"
            formControlName="name"
            class="bg-gray-100 border border-gray-200 rounded py-1 px-3 block focus:ring-teal-light focus:border-teal-light text-gray-700 w-full"
            placeholder="Enter resource name"
          />

          <div
            *ngIf="
              editResourceForm.get('name')?.invalid &&
              (editResourceForm.get('name')?.dirty ||
                editResourceForm.get('name')?.touched)
            "
            class="mt-1 text-sm text-red-600"
          >
            <div *ngIf="editResourceForm.get('name')?.hasError('required')">
              Name is required.
            </div>
          </div>
        </div>
      </div>

      <div>
        <label for="quantity" class="text-md text-gray-700 block mb-1 font-bold"
          >Quantity</label
        >
        <div class="mt-1">
          <input
            type="number"
            name="quantity"
            id="quantity"
            formControlName="quantity"
            class="bg-gray-100 border border-gray-200 rounded py-1 px-3 block focus:ring-teal-light focus:border-teal-light text-gray-700 w-full"
            placeholder="0"
          />
          <div
            *ngIf="
              editResourceForm.get('quantity')?.invalid &&
              (editResourceForm.get('quantity')?.dirty ||
                editResourceForm.get('quantity')?.touched)
            "
            class="mt-1 text-sm text-red-600"
          >
            <div *ngIf="editResourceForm.get('quantity')?.hasError('required')">
              Quantity is required.
            </div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <label
        for="description"
        class="text-md text-gray-700 block mb-1 font-bold"
        >Description</label
      >
      <div class="mt-1">
        <textarea
          type="text"
          name="description"
          id="description"
          formControlName="description"
          class="bg-gray-100 border border-gray-200 rounded py-1 px-3 block focus:ring-teal-light focus:border-teal-light text-gray-700 w-full"
          placeholder="Enter resource description"
        ></textarea>
        <div
          *ngIf="
            editResourceForm.get('description')?.invalid &&
            (editResourceForm.get('description')?.dirty ||
              editResourceForm.get('description')?.touched)
          "
          class="mt-1 text-sm text-red-600"
        >
          <div
            *ngIf="editResourceForm.get('description')?.hasError('required')"
          >
            Description is required.
          </div>
        </div>
      </div>
    </div>

    <!-- Message de succès -->
    <div
      *ngIf="successMessage"
      class="mb-4 p-4 rounded-md bg-green-50 border border-green-200"
    >
      <div class="flex">
        <div class="flex-shrink-0">
          <svg
            class="h-5 w-5 text-green-400"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm font-medium text-green-800">
            {{ successMessage }}
          </p>
        </div>
      </div>
    </div>

    <!-- Message d'erreur -->
    <div
      *ngIf="errorMessage"
      class="mb-4 p-4 rounded-md bg-red-50 border border-red-200"
    >
      <div class="flex">
        <div class="flex-shrink-0">
          <svg
            class="h-5 w-5 text-red-400"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm font-medium text-green-800">
            {{ errorMessage }}
          </p>
        </div>
      </div>
    </div>

    <div class="space-x-4 mt-8">
      <button
        type="submit"
        class="py-2 px-4 bg-teal-light text-white rounded hover:bg-teal-dark active:bg-teal-light disabled:opacity-50"
        [class.bg-teal]="!editResourceForm.invalid && editResourceForm.dirty"
        [class.hover:bg-teal-light]="
          !editResourceForm.invalid && editResourceForm.dirty
        "
        [class.focus:ring-teal-light]="
          !editResourceForm.invalid && editResourceForm.dirty
        "
        [class.bg-teal-dark]="
          editResourceForm.invalid || !editResourceForm.dirty
        "
        [class.cursor-not-allowed]="
          editResourceForm.invalid || !editResourceForm.dirty
        "
        [disabled]="editResourceForm.invalid || !editResourceForm.dirty"
      >
        Edit
      </button>
    </div>
  </form>
</div>
