<div class="p-8 rounded border border-gray-200">
  <form [formGroup]="addResourceForm" (ngSubmit)="onSubmit()">
    <div class="mt-8 grid lg:grid-cols-2 gap-4">
      <div>
        <label for="name" class="text-md text-gray-700 block mb-1 font-bold"
          >Name</label
        >
        <div class="mt-1">
          <input
            type="text"
            name="name"
            id="name"
            formControlName="name"
            class="bg-gray-100 border border-gray-200 rounded py-1 px-3 block focus:ring-teal-light focus:border-teal-light text-gray-700 w-full"
            placeholder="Enter resource's name"
          />

          <div
            *ngIf="
              addResourceForm.get('name')?.invalid &&
              (addResourceForm.get('name')?.dirty ||
                addResourceForm.get('name')?.touched)
            "
            class="mt-1 text-sm text-red-600"
          >
            <div *ngIf="addResourceForm.get('name')?.hasError('required')">
              Name is required.
            </div>
          </div>
        </div>
      </div>

      <div>
        <label for="quantity" class="text-md text-gray-700 block mb-1 font-bold"
          >Quantity</label
        >
        <div class="mt-1">
          <input
            type="number"
            name="quantity"
            id="quantity"
            formControlName="quantity"
            class="bg-gray-100 border border-gray-200 rounded py-1 px-3 block focus:ring-teal-light focus:border-teal-light text-gray-700 w-full"
            placeholder="0"
          />
          <div
            *ngIf="
              addResourceForm.get('quantity')?.invalid &&
              (addResourceForm.get('quantity')?.dirty ||
                addResourceForm.get('quantity')?.touched)
            "
            class="mt-1 text-sm text-red-600"
          >
            <div *ngIf="addResourceForm.get('quantity')?.hasError('required')">
              Quantity is required.
            </div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <label
        for="description"
        class="text-md text-gray-700 block mb-1 font-bold"
        >Description</label
      >
      <div class="mt-1">
        <textarea
          type="text"
          name="description"
          id="description"
          formControlName="description"
          placeholder="Enter resource description"
          class="bg-gray-100 border border-gray-200 rounded py-1 px-3 block focus:ring-teal-light focus:border-teal-light text-gray-700 w-full"
        ></textarea>
        <div
          *ngIf="
            addResourceForm.get('description')?.invalid &&
            (addResourceForm.get('description')?.dirty ||
              addResourceForm.get('description')?.touched)
          "
          class="mt-1 text-sm text-red-600"
        >
          <div *ngIf="addResourceForm.get('description')?.hasError('required')">
            Description is required.
          </div>
        </div>
      </div>
    </div>

    <div class="space-x-4 mt-8">
      <button
        type="submit"
        class="py-2 px-4 bg-teal-light text-white rounded hover:bg-teal-dark active:bg-teal-light disabled:opacity-50"
        [class.bg-teal]="!addResourceForm.invalid"
        [class.hover:bg-teal-light]="!addResourceForm.invalid"
        [class.focus:ring-teal-light]="!addResourceForm.invalid"
        [class.bg-teal-dark]="addResourceForm.invalid"
        [class.cursor-not-allowed]="addResourceForm.invalid"
        [disabled]="addResourceForm.invalid"
      >
        Save
      </button>
    </div>
  </form>
</div>
