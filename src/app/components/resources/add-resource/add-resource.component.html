<div class="p-6 rounded-2xl border border-gray-200 bg-white shadow-sm">
  <form [formGroup]="addResourceForm" (ngSubmit)="onSubmit()">
    <div class="grid lg:grid-cols-2 gap-6">
      <!-- Name Field -->
      <div>
        <label for="name" class="block text-sm font-semibold text-gray-800 mb-2">
          Name
        </label>
        <input
          type="text"
          id="name"
          formControlName="name"
          class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-2 text-gray-800 placeholder-gray-400 shadow-sm focus:border-teal-500 focus:ring-2 focus:ring-teal-200 focus:outline-none"
          placeholder="Enter resource's name"
        />
        <div
          *ngIf="addResourceForm.get('name')?.invalid && (addResourceForm.get('name')?.dirty || addResourceForm.get('name')?.touched)"
          class="mt-1 text-sm text-red-500"
        >
          <span *ngIf="addResourceForm.get('name')?.hasError('required')">
            Name is required.
          </span>
        </div>
      </div>

      <!-- Quantity Field -->
      <div>
        <label for="quantity" class="block text-sm font-semibold text-gray-800 mb-2">
          Quantity
        </label>
        <input
          type="number"
          id="quantity"
          formControlName="quantity"
          class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-2 text-gray-800 placeholder-gray-400 shadow-sm focus:border-teal-500 focus:ring-2 focus:ring-teal-200 focus:outline-none"
          placeholder="0"
        />
        <div
          *ngIf="addResourceForm.get('quantity')?.invalid && (addResourceForm.get('quantity')?.dirty || addResourceForm.get('quantity')?.touched)"
          class="mt-1 text-sm text-red-500"
        >
          <span *ngIf="addResourceForm.get('quantity')?.hasError('required')">
            Quantity is required.
          </span>
        </div>
      </div>
    </div>

    <!-- Description Field -->
    <div class="mt-6">
      <label for="description" class="block text-sm font-semibold text-gray-800 mb-2">
        Description
      </label>
      <textarea
        id="description"
        formControlName="description"
        placeholder="Enter resource description"
        rows="4"
        class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-2 text-gray-800 placeholder-gray-400 shadow-sm focus:border-teal-500 focus:ring-2 focus:ring-teal-200 focus:outline-none"
      ></textarea>
      <div
        *ngIf="addResourceForm.get('description')?.invalid && (addResourceForm.get('description')?.dirty || addResourceForm.get('description')?.touched)"
        class="mt-1 text-sm text-red-500"
      >
        <span *ngIf="addResourceForm.get('description')?.hasError('required')">
          Description is required.
        </span>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="mt-8">
      <button
        type="submit"
        [disabled]="addResourceForm.invalid"
        class="rounded-xl px-6 py-2 font-medium text-white transition-colors duration-200 
          disabled:cursor-not-allowed disabled:bg-gray-300 
          bg-teal-500 hover:bg-teal-600 focus:ring-2 focus:ring-offset-2 focus:ring-teal-400"
      >
        Save
      </button>
    </div>
  </form>
</div>
