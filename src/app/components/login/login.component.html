<div class="flex flex-col sm:grid sm:grid-cols-2 gap-1">
  <div class="absolute top-4 left-4 sm:left-6 z-10">
    <img class="w-32" src="assets/logo.png" alt="Logo" />
  </div>
  <div
    class="order-1 sm:order-none mt-16 sm:mt-32 px-4 sm:px-0 sm:mx-auto sm:w-full sm:max-w-md"
  >
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
      <h1 class="text-center text-3xl font-extrabold text-teal-light">
        Welcome
      </h1>
      <p class="mt-2 text-center text-sm text-gray-600">
        Enter your email and password to sign in.
      </p>
    </div>
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
      <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div>
          <div class="space-y-4">
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700"
                >Email</label
              >
              <div class="mt-1">
                <input
                  id="email"
                  name="email"
                  type="email"
                  formControlName="email"
                  autocomplete="email"
                  required
                  class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#4FD1C5] focus:border-[#4FD1C5] sm:text-sm"
                  [class.border-red-300]="
                    loginForm.get('email')?.invalid &&
                    (loginForm.get('email')?.dirty ||
                      loginForm.get('email')?.touched)
                  "
                />

                <div
                  *ngIf="
                    loginForm.get('email')?.invalid &&
                    (loginForm.get('email')?.dirty ||
                      loginForm.get('email')?.touched)
                  "
                  class="mt-1 text-sm text-red-600"
                >
                  <div *ngIf="loginForm.get('email')?.hasError('required')">
                    Email is required.
                  </div>
                  <div *ngIf="loginForm.get('email')?.hasError('email')">
                    Invalid email format.
                  </div>
                </div>
              </div>
            </div>

            <div>
              <label
                for="password"
                class="block text-sm font-medium text-gray-700"
                >Password</label
              >
              <div class="mt-1">
                <input
                  id="password"
                  name="password"
                  type="password"
                  formControlName="password"
                  autocomplete="current-password"
                  required
                  class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#4FD1C5] focus:border-[#4FD1C5] sm:text-sm"
                  [class.border-red-300]="
                    loginForm.get('password')?.invalid &&
                    (loginForm.get('password')?.dirty ||
                      loginForm.get('password')?.touched)
                  "
                />

                <div
                  *ngIf="
                    loginForm.get('password')?.invalid &&
                    (loginForm.get('password')?.dirty ||
                      loginForm.get('password')?.touched)
                  "
                  class="mt-1 text-sm text-red-600"
                >
                  <div *ngIf="loginForm.get('password')?.hasError('required')">
                    Password is required.
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div>
          <button
            type="submit"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white focus:outline-none focus:ring-2 focus:ring-offset-2"
            [class.bg-teal]="!loginForm.invalid"
            [class.hover:bg-teal-light]="!loginForm.invalid"
            [class.focus:ring-teal-light]="!loginForm.invalid"
            [class.bg-teal-dark]="loginForm.invalid"
            [class.cursor-not-allowed]="loginForm.invalid"
            [disabled]="loginForm.invalid"
          >
            Sign in
          </button>
        </div>

        <div *ngIf="errorMessage" class="mt-2 text-center text-sm text-red-600">
          {{ errorMessage }}
        </div>
      </form>
    </div>
  </div>
  <div class="order-2 sm:order-none">
    <img
      class="w-full h-auto sm:h-screen object-cover"
      src="assets/bg.png"
      alt="Login Image"
    />
  </div>
</div>
