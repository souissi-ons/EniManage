<div class="min-h-screen grid grid-cols-1 sm:grid-cols-2 relative">
  <!-- Logo -->
  <div class="absolute top-4 left-4 sm:left-6 z-10">
    <img class="w-28 sm:w-32" src="assets/logo.png" alt="Logo" />
  </div>

  <!-- Form Section -->
  <div class="flex items-center justify-center px-6 py-12 sm:px-12 lg:px-16 bg-white">
    <div class="w-full max-w-md space-y-6">
      <div>
        <h1 class="text-center text-3xl font-extrabold text-teal-light">
          Welcome
        </h1>
        <p class="mt-2 text-center text-sm text-gray-600">
          Enter your email and password to sign in.
        </p>
      </div>

      <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            required
            class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#4FD1C5] focus:border-[#4FD1C5] sm:text-sm"
            [class.border-red-300]="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)"
          />
          <div
            *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)"
            class="mt-1 text-sm text-red-600"
          >
            <div *ngIf="loginForm.get('email')?.hasError('required')">Email is required.</div>
            <div *ngIf="loginForm.get('email')?.hasError('email')">Invalid email format.</div>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            required
            class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#4FD1C5] focus:border-[#4FD1C5] sm:text-sm"
            [class.border-red-300]="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)"
          />
          <div
            *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)"
            class="mt-1 text-sm text-red-600"
          >
            <div *ngIf="loginForm.get('password')?.hasError('required')">Password is required.</div>
          </div>
        </div>

        <!-- Submit -->
        <div>
          <button
            type="submit"
            class="w-full flex justify-center py-2 px-4 rounded-md shadow-sm text-sm font-medium text-white transition-all duration-150"
            [class.bg-teal]="!loginForm.invalid"
            [class.hover:bg-teal-light]="!loginForm.invalid"
            [class.focus:ring-teal-light]="!loginForm.invalid"
            [class.bg-teal-dark]="loginForm.invalid"
            [class.cursor-not-allowed]="loginForm.invalid"
            [disabled]="loginForm.invalid"
          >
            Sign in
          </button>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="mt-2 text-center text-sm text-red-600">
          {{ errorMessage }}
        </div>
      </form>
    </div>
  </div>

  <!-- Image Section -->
  <div class="hidden sm:block">
    <img
      class="w-full h-full object-cover"
      src="assets/bg.png"
      alt="Login Background"
    />
  </div>
</div>
