<div class="h-screen w-full flex flex-col sm:flex-row overflow-hidden">
  <!-- Logo (Fixed Position) -->
  <div class="absolute top-6 left-6 z-20">
    <img class="w-32 sm:w-36" src="assets/logo.png" alt="Logo" />
  </div>

  <!-- Form Section -->
  <div class="flex-1 flex items-center justify-center p-6 sm:p-12 bg-white overflow-y-auto">
    <div class="w-full max-w-md space-y-8">
      <div class="text-center">
        <h1 class="text-4xl font-bold text-teal-600 mb-2">Welcome Back</h1>
        <p class="text-gray-500">Sign in to access your account</p>
      </div>

      <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email Field -->
        <div class="space-y-2">
          <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
          <input
            id="email"
            name="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            required
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all duration-200 focus:outline-none"
            [class.border-red-500]="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)"
            placeholder="you@example.com"
          />
          <div *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)" 
               class="text-red-600 text-sm">
            <span *ngIf="loginForm.get('email')?.hasError('required')">Email is required</span>
            <span *ngIf="loginForm.get('email')?.hasError('email')">Please enter a valid email</span>
          </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          </div>
          <input
            id="password"
            name="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            required
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all duration-200 focus:outline-none"
            [class.border-red-500]="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)"
            placeholder="••••••••"
          />
          <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)" 
               class="text-red-600 text-sm">
            <span *ngIf="loginForm.get('password')?.hasError('required')">Password is required</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full py-3 px-4 bg-teal-600 hover:bg-teal-700 focus:ring-teal-500 focus:ring-offset-2 text-white font-medium rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="loginForm.invalid"
        >
          Sign In
        </button>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="p-3 bg-red-50 text-red-600 rounded-lg text-sm text-center">
          {{ errorMessage }}
        </div>
      </form>

      <!-- Footer Links -->
      
    </div>
  </div>

  <!-- Image Section -->
  <div class="hidden sm:block flex-1 relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-r from-teal-500/10 to-teal-600/20 z-10"></div>
    <img
      class="w-full h-full object-cover object-center"
      src="assets/bg.png"
      alt="Background"
    />
    
  </div>
</div>
